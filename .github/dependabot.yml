# dependabot
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# ------------------------------------------------------------------------------
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    # open a single pull-request for all GitHub actions updates
    github-actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  groups:
    # open a single pull-request for all Docker image updates
    docker:
      patterns:
      - '*'
  ignore:
    # the major version of eclipse-temurin is the Java version, which we only
    # update by hand to the next LTS release
    - dependency-name: eclipse-temurin
      update-types: ['version-update:semver-major']
